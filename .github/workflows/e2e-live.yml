name: E2E live app

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live app on mobile
        env:
          APP_URL: https://uptobe8.github.io/Radar-IA-app/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 3,
            locale: 'es-ES'
          })
          const page = await context.newPage()
          const pageErrors = []
          page.on('pageerror', e => pageErrors.push(String(e)))

          await page.goto(process.env.APP_URL, { waitUntil: 'networkidle', timeout: 120000 })
          await page.evaluate(() => localStorage.clear())
          await page.reload({ waitUntil: 'networkidle', timeout: 120000 })

          const body = await page.locator('body').innerText()
          if (!body.includes('RADAR CERO')) throw new Error('No aparece RADAR CERO')
          if (!body.includes('Nuevo estudio')) throw new Error('No aparece Nuevo estudio')

          await page.getByLabel('Nombre', { exact: true }).fill('Aitor')
          await page.getByLabel('Primer apellido', { exact: true }).fill('Ruano')
          await page.getByLabel('Segundo apellido', { exact: true }).fill('Pino')
          const sexSelect = page.locator('select').first()
          if (await sexSelect.count()) await sexSelect.selectOption('M')
          await page.getByLabel('Nacimiento aproximado', { exact: true }).fill('20/01/1981')
          await page.getByLabel('Municipio', { exact: true }).fill('Madrid')
          await page.getByLabel('Provincia', { exact: true }).fill('Madrid')
          await page.getByRole('button', { name: 'CREAR ESTUDIO E INVESTIGAR' }).click()

          await page.waitForFunction(() => {
            const studies = JSON.parse(localStorage.getItem('radar-cero-studies-v5') || '[]')
            return studies[0]?.status === 'completed'
          }, null, { timeout: 360000 })

          const study = await page.evaluate(() => JSON.parse(localStorage.getItem('radar-cero-studies-v5') || '[]')[0])
          if (!study) throw new Error('No se guardó el estudio')
          if (!study.runs?.length) throw new Error('No hubo ejecuciones de fuentes')
          if (pageErrors.length) throw new Error(`Errores JavaScript: ${pageErrors.join(' | ')}`)

          const sourceSummary = study.runs.map(r => ({
            source: r.source,
            sourceId: r.sourceId,
            status: r.status,
            hits: r.hits || 0,
            verifiedHits: r.verifiedHits || 0,
            error: r.error || '',
            query: r.query || '',
            url: r.url || ''
          }))

          console.log('AITOR_STUDY_OK')
          console.log(JSON.stringify({
            title: study.title,
            status: study.status,
            root: study.people?.find(p => p.isRoot),
            runs: study.runs.length,
            evidence: study.evidence || [],
            people: study.people || [],
            relations: study.relations || [],
            events: study.events || [],
            places: study.places || [],
            conflicts: study.conflicts || [],
            conclusion: study.lastConclusion,
            sourceSummary
          }, null, 2))

          await browser.close()
          EOF
