name: E2E live app

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live app on mobile
        env:
          APP_URL: https://uptobe8.github.io/Radar-IA-app/
        run: |
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 3,
            locale: 'es-ES'
          })
          const page = await context.newPage()
          const pageErrors = []
          page.on('pageerror', e => pageErrors.push(String(e)))

          await page.goto(process.env.APP_URL, { waitUntil: 'networkidle', timeout: 120000 })
          await page.evaluate(() => localStorage.clear())
          await page.reload({ waitUntil: 'networkidle', timeout: 120000 })

          await page.getByLabel('Nombre', { exact: true }).fill('Aitor')
          await page.getByLabel('Primer apellido', { exact: true }).fill('Ruano')
          await page.getByLabel('Segundo apellido', { exact: true }).fill('Pino')
          await page.getByLabel('Fecha de nacimiento', { exact: true }).fill('20/01/1981')
          await page.getByLabel('Lugar', { exact: true }).fill('Madrid')
          await page.getByRole('button', { name: 'CREAR ESTUDIO' }).click()

          await page.getByText('Aitor Ruano Pino', { exact: true }).first().waitFor()
          const sourceCards = page.locator('.source-card')
          if (await sourceCards.count() !== 7) throw new Error('No aparecen las 7 fuentes esperadas')

          await page.getByRole('button', { name: 'evidencias' }).click()
          await page.getByLabel('Título / tipo de documento').fill('Registro de prueba verificable')
          await page.getByLabel('Fecha').fill('20/01/1981')
          await page.getByLabel('Lugar').fill('Madrid')
          await page.getByLabel('Personas relacionadas').fill('Aitor Ruano Pino')
          await page.getByLabel('Parentesco / evento').fill('Nacimiento')
          await page.getByLabel('URL del documento').fill('https://www.familysearch.org/')
          await page.getByLabel('Notas').fill('Evidencia de prueba E2E')
          await page.getByRole('button', { name: 'GUARDAR EVIDENCIA' }).click()

          const saved = await page.evaluate(() => JSON.parse(localStorage.getItem('radar-cero-simple-v1') || 'null'))
          if (!saved) throw new Error('No se guardó el estudio')
          if (saved.person?.givenNames !== 'Aitor' || saved.person?.surname1 !== 'Ruano' || saved.person?.surname2 !== 'Pino') throw new Error('Datos de persona incorrectos')
          if (saved.evidence?.length !== 1) throw new Error('La evidencia no se guardó')

          await page.getByRole('button', { name: 'informe' }).click()
          const reportText = await page.locator('.report').innerText()
          if (!reportText.includes('1 evidencias verificables')) throw new Error('El informe no refleja la evidencia')
          if (!reportText.includes('Registro de prueba verificable')) throw new Error('El informe no muestra la evidencia')
          if (!reportText.includes('FamilySearch')) throw new Error('El informe no muestra la fuente')
          if (pageErrors.length) throw new Error(`Errores JavaScript: ${pageErrors.join(' | ')}`)

          console.log('SIMPLE_RADAR_E2E_OK')
          console.log(JSON.stringify({person:saved.person,evidence:saved.evidence.length,sources:7,report:true}, null, 2))
          await browser.close()
          EOF
